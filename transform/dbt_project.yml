name: google_ads_reporting
version: "1.0.0"
config-version: 2
profile: google_ads_reporting

model-paths: ["models"]
test-paths: ["tests"]
clean-targets: ["target", "logs"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Dataset (BigQuery) or schema (DuckDB) the extractor loads into.
  google_ads_raw_schema: google_ads_raw
  # Campaign spend may differ from account spend by at most this share on any day.
  spend_reconciliation_tolerance: 0.005
  # Month-to-date spend below 90% or above 110% of month-to-date budget is flagged.
  pacing_under_threshold: 0.9
  pacing_over_threshold: 1.1

models:
  google_ads_reporting:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

version: 2

models:
  - name: stg_google_ads__account_daily
    description: One row per account per day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [customer_id, date_day]
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: date_day
        data_tests: [not_null]
      - name: currency_code
        data_tests: [not_null]
      - name: cost
        description: Spend in account currency (cost_micros / 1,000,000).
        data_tests: [not_null]

  - name: stg_google_ads__campaign_daily
    description: One row per campaign per day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [customer_id, campaign_id, date_day]
    columns:
      - name: customer_id
        data_tests: [not_null]
      - name: campaign_id
        data_tests: [not_null]
      - name: date_day
        data_tests: [not_null]
      - name: campaign_status
        data_tests:
          - accepted_values:
              arguments:
                values: [ENABLED, PAUSED, REMOVED]
      - name: advertising_channel_type
        data_tests:
          - accepted_values:
              arguments:
                values: [SEARCH, DISPLAY, SHOPPING, HOTEL, VIDEO, MULTI_CHANNEL, LOCAL, SMART,
                         PERFORMANCE_MAX, LOCAL_SERVICES, TRAVEL, DEMAND_GEN]
              # Google adds channel types over time: flag a new one, do not stop the build.
              config:
                severity: warn
      - name: cost
        data_tests: [not_null]

  - name: stg_google_ads__ad_group_daily
    description: One row per ad group per day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [customer_id, ad_group_id, date_day]
    columns:
      - name: ad_group_id
        data_tests: [not_null]
      - name: date_day
        data_tests: [not_null]
      - name: ad_group_status
        data_tests:
          - accepted_values:
              arguments:
                values: [ENABLED, PAUSED, REMOVED]

  - name: stg_google_ads__campaign_budget_snapshots
    description: One row per campaign per snapshot date, with the budget it used that day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [customer_id, campaign_id, snapshot_date]
    columns:
      - name: budget_id
        data_tests: [not_null]
      - name: snapshot_date
        data_tests: [not_null]
      - name: budget_period
        data_tests:
          - accepted_values:
              arguments:
                values: [DAILY, CUSTOM_PERIOD]
